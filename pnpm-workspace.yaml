packages:
  - '*'

overrides:
  '@types/react': 19.2.17

minimumReleaseAgeExclude:
  - framer-motion@12.40.0
  - motion-dom@12.40.0

# Keep install behavior aligned with the previous pnpm default, which did not
# run dependency build scripts unless they were explicitly approved.
allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false
